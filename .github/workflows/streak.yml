name: Generate Streak Stats

on:
  schedule:
    - cron: "30 0 * * *"  # 30 min after the snake
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/streak.yml"

permissions:
  contents: write

jobs:
  build:
    name: Generate streak stats SVG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=gotham&hide_border=true&date_format=M%20j%5B%2C%20Y%5D
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # The generator's earliest-commit bucket reads from a 2015 account artifact;
      # rewrite the Total Contributions range to the real start year.
      - name: Fix contributions range label
        run: |
          sed -i -E 's/[A-Z][a-z]+ [0-9]{1,2}, 20[0-9]{2} - Present/2026 - Present/' profile/streak.svg
          grep -q "2026 - Present" profile/streak.svg

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "chore: update streak stats" || exit 0
          git push
